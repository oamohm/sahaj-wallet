name: sahaj-wallet

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahaj
      POSTGRES_PASSWORD: sahaj
      POSTGRES_DB: sahaj_wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahaj -d sahaj_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: syncs the Prisma schema against `postgres`, then exits.
  # Uses `db push` (not `migrate deploy`) because this repo hasn't had its
  # first migration generated yet — run `pnpm db:migrate` once against a
  # running Postgres to create real migration history, commit it, then
  # switch this command to `pnpm --filter @sahaj/database prisma:deploy`.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sahaj:sahaj@postgres:5432/sahaj_wallet
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@sahaj/database", "prisma:push"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://sahaj:sahaj@postgres:5432/sahaj_wallet
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ACTIVE_BRAND: sahaj
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
